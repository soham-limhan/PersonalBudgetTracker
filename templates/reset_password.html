{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="glass-card">
            <h3>🔐 Reset Password</h3>

            {% if error %}
            <div class="alert alert-danger"
                style="background: rgba(250, 112, 154, 0.3); border: 1px solid rgba(250, 112, 154, 0.5);">
                {{ error }}
            </div>
            {% endif %}

            {% if success %}
            <div class="alert alert-success"
                style="background: rgba(79, 172, 254, 0.3); border: 1px solid rgba(79, 172, 254, 0.5);">
                {{ success }}
            </div>
            {% endif %}

            <form method="post">
                <div class="mb-3">
                    <label class="form-label">Current Password</label>
                    <input type="password" name="current_password" class="form-control"
                        placeholder="Enter current password" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" name="new_password" class="form-control" placeholder="Enter new password"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-control"
                        placeholder="Confirm new password" required>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">✨ Update Password</button>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-outline-primary">🔙 Back to Dashboard</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

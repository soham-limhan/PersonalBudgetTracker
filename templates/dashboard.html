{% extends 'base.html' %}
{% block content %}
<div class="row">
  <div class="col-md-4">
    <div class="glass-card">
      <h3>💰 Add Transaction</h3>
      <form method="post" action="{{ url_for('add_expense') }}">
        <div class="mb-2">
          <label class="form-label">Type</label>
          <select name="type" class="form-select">
            <option value="expense" selected>💸 Expense</option>
            <option value="credit">💵 Credit (Add Money)</option>
          </select>
        </div>
        <div class="mb-2">
          <label class="form-label">Amount</label>
          <input name="amount" type="number" step="0.01" class="form-control" placeholder="0.00" required>
        </div>
        <div class="mb-2">
          <label class="form-label">Category</label>
          <input name="category" class="form-control" value="Other" placeholder="e.g., Food, Transport">
        </div>
        <div class="mb-2">
          <label class="form-label">Date</label>
          <input name="date" type="date" class="form-control">
        </div>
        <div class="mb-2">
          <label class="form-label">Note</label>
          <input name="note" class="form-control" placeholder="Optional note">
        </div>
        <button class="btn btn-primary w-100">✨ Add Transaction</button>
      </form>
    </div>

    <div class="glass-card">
      <h4>📊 Monthly Budget</h4>
      <div id="budget-section" class="mb-3">
        <div id="budget-display" class="mb-3 p-3" style="background: rgba(255,255,255,0.1); border-radius: 16px;">
          Loading budget...</div>
        <form id="budget-form" class="mb-3" onsubmit="return false;">
          <label class="form-label">Set Budget</label>
          <div class="d-flex gap-2">
            <input id="budget-input" name="budget" type="number" step="0.01" class="form-control"
              placeholder="Monthly budget">
            <button id="budget-save" class="btn btn-outline-primary">💾 Save</button>
          </div>
        </form>
        <form id="budget-credit-form" onsubmit="return false;">
          <label class="form-label">Add Credit</label>
          <div class="d-flex gap-2">
            <input id="budget-credit-input" name="credit" type="number" step="0.01" class="form-control"
              placeholder="Add credit to budget">
            <button id="budget-credit-save" class="btn btn-outline-success">➕ Add</button>
          </div>
        </form>
      </div>
    </div>

    <div class="glass-card">
      <h4>🧾 Recent Expenses</h4>
      <ul id="expense-list" class="list-group"></ul>
    </div>
  </div>

  <div class="col-md-8">
    <div class="glass-card">
      <h3>📈 Spending Visualization</h3>
      <div class="row">
        <div class="col-md-6">
          <div class="mb-2" style="text-align: center; color: rgba(255,255,255,0.9); font-weight: 600;">Category
            Breakdown</div>
          <canvas id="categoryChart"></canvas>
        </div>
        <div class="col-md-6">
          <div class="mb-2" style="text-align: center; color: rgba(255,255,255,0.9); font-weight: 600;">Monthly Trends
          </div>
          <canvas id="monthChart"></canvas>
        </div>
      </div>
      <div class="row mt-4">
        <div class="col-md-6">
          <div class="mb-2" style="text-align: center; color: rgba(255,255,255,0.9); font-weight: 600;">Budget Overview
          </div>
          <canvas id="budgetChart"></canvas>
        </div>
        <div class="col-md-6">
          <div id="saved-display" class="p-4"
            style="background: rgba(255,255,255,0.12); backdrop-filter: blur(10px); border-radius: 24px; border: 1px solid rgba(255,255,255,0.2);">
            <h5>💎 Savings Summary</h5>
            <div id="saved-content">Loading...</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% endblock %}
